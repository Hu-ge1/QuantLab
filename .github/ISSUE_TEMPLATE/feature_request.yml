name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 先讲场景和痛点，不要直接跳到方案
      placeholder: |-
        我在做……的时候，遇到了……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你设想的方案
      placeholder: |-
        希望可以……
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 现在是用什么办法绕过去的？
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: 影响范围
      description: 可多选，帮助判断改动面
      options:
        - label: 后端 API / 数据层
        - label: 前端界面
        - label: 启动器 / 部署方式
        - label: 文档
        - label: 可能涉及 QMT 实盘接入
